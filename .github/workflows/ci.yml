name: CI

# Runs the full pre-Stage-1 verification gate on every push to main and on PRs:
# build + unit tests, Postgres integration, full Docker-stack integration,
# helm lint, and a trivy HIGH/CRITICAL image scan. Mirrors the gates documented
# in docs/fdp-plan.md so the posture is enforced, not just locally verified.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      # Typecheck covers test files too (tsconfig.json), which `build`
      # (tsconfig.build.json) excludes — so this catches type errors in tests
      # that build + vitest (esbuild, no typecheck) would miss.
      - name: Typecheck
        run: pnpm run typecheck
      - name: Unit tests
        run: pnpm run test

  postgres-integration:
    name: Postgres integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        # Plain Postgres 17. The AGE image was pinned here when the provider
        # mirrored the graph; that mirror was removed in 15098b1 and a
        # regression test asserts the DDL emits no AGE statement. Testing
        # against an image no deployment uses hides exactly the failures
        # this job exists to catch.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: altius_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # `pnpm --filter ... test` runs the package's vitest directly (bypasses
      # turbo's test->build dependsOn), so workspace deps (e.g. @altius/odl)
      # must be built first or vite can't resolve them.
      - name: Build workspace
        run: pnpm run build
      - name: Initialise Postgres extensions
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          # pg_trgm backs the GIN trigram indexes the DDL emits for FULLTEXT
          # fields. ON_ERROR_STOP so a failure here fails the job rather than
          # surfacing later as an unexplained missing index.
          PGPASSWORD=postgres psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d altius_test \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
      - name: Storage-postgres integration tests
        env:
          PG_TEST_URL: postgresql://postgres:postgres@localhost:5432/altius_test
          # A skipped Postgres suite is indistinguishable from a passing one in
          # the job summary, which is how three defects shipped green. With this
          # set, a missing PG_TEST_URL raises instead of skipping.
          REQUIRE_PG: '1'
        run: pnpm --filter @altius/storage-postgres test
      # The shared SPI conformance suite runs against the memory provider in the
      # unit job. Without PG_TEST_URL it skips the Postgres half entirely, so any
      # behaviour that differed between the two providers — a filter honoured by
      # one and ignored by the other — was structurally undetectable here.
      - name: SPI conformance against Postgres
        env:
          PG_TEST_URL: postgresql://postgres:postgres@localhost:5432/altius_test
          # A skipped Postgres suite is indistinguishable from a passing one in
          # the job summary, which is how three defects shipped green. With this
          # set, a missing PG_TEST_URL raises instead of skipping.
          REQUIRE_PG: '1'
        run: pnpm --filter @altius/spi-conformance test
      # A stack that fails to come up leaves no trace in the job output: the
      # `up --wait` step reports only "container X exited (1)", and the reason
      # lives in a container log nobody ever printed. Four integration jobs
      # have been red since this workflow was written and none of them said
      # why. Dump the logs on failure so the next red run is diagnosable.
      - name: Container logs (on failure)
        if: failure()
        env:
          # The prod-test overlay declares OPENFGA_STORE_ID as required, and the
          # spec sets it only for the stack it starts — not for this step. A
          # placeholder keeps interpolation happy; nothing is started here, so
          # the value is never used. Without it the dump fails to parse and
          # reports the missing variable instead of the logs it exists to show.
          OPENFGA_STORE_ID: diagnostic-placeholder
          OIDC_DEFAULT_TENANT: diagnostic-placeholder
        run: |
          files=""
          for f in Orion/docker-compose.yaml Orion/docker-compose.test.yaml Orion/docker-compose.prod-test.yaml; do
            [ -f "$f" ] && files="$files -f $f"
          done
          docker compose $files ps -a || true
          docker compose $files logs --no-color --tail 200 || true
  docker-stack-integration:
    name: Docker-stack integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # docker-compose.yaml has two intentionally-required vars (no defaults —
    # fail loud in prod): POSTGRES_PASSWORD and KEYCLOAK_ADMIN_PASSWORD. Supply
    # throwaway values for the CI stack; they stay consistent across containers.
    env:
      POSTGRES_PASSWORD: postgres
      KEYCLOAK_ADMIN_PASSWORD: admin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Compose reads Orion/.env (project dir) for the two intentionally-
      # required vars. Writing the file (not just job env) is essential: the
      # integration tests run via turbo, whose strict env mode strips job env
      # from the task, so the harness's `docker compose` children would
      # otherwise not see the vars. This mirrors local dev (Orion/.env exists).
      - name: Create Orion/.env for compose
        run: |
          printf 'POSTGRES_PASSWORD=postgres\nKEYCLOAK_ADMIN_PASSWORD=admin\n' > Orion/.env
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build stack images
        # bake resolves the named build contexts (deps-full/deps-app) that
        # plain `docker compose build` cannot — see docker-bake.hcl. --load
        # puts the orion-<service>:latest images in the local daemon so the
        # `docker compose up` step below finds them without rebuilding.
        run: docker buildx bake --load
      # Bring the stack up here (not inside the test harness): the harness's
      # dockerComposeUp wraps `up --wait` in a 300s execSync wall-timeout, which
      # a cold 14-service stack can exceed on CI runners. Starting it in a
      # dedicated step uses compose's own --wait-timeout; the harness then sees
      # the stack already healthy (isStackHealthy) and skips its own up.
      - name: Start stack
        run: >-
          docker compose
          -f Orion/docker-compose.yaml
          -f Orion/docker-compose.test.yaml
          up -d --wait --wait-timeout 600
      - name: Integration tests
        run: pnpm run test:integration
      # Six consecutive runs failed on `container orion-web-1 is unhealthy`
      # with no container output captured anywhere, so every attempt to fix it
      # was a guess from the outside. `up --wait` prints only which container it
      # gave up on; the reason lives in that container's log and in its last
      # healthcheck result, and the teardown below destroys both.
      - name: Diagnose stack on failure
        if: failure()
        run: |
          set +e
          COMPOSE="docker compose -f Orion/docker-compose.yaml -f Orion/docker-compose.test.yaml"
          echo "::group::container status"
          $COMPOSE ps -a
          echo "::endgroup::"
          echo "::group::healthcheck output"
          for c in $($COMPOSE ps -aq); do
            echo "--- $(docker inspect -f '{{.Name}}' $c)"
            docker inspect -f '{{json .State.Health}}' $c
          done
          echo "::endgroup::"
          echo "::group::container logs"
          $COMPOSE logs --no-color --tail=200
          echo "::endgroup::"
      - name: Tear down stack
        if: always()
        run: >-
          docker compose
          -f Orion/docker-compose.yaml
          -f Orion/docker-compose.test.yaml
          down -v --remove-orphans
      # A stack that fails to come up leaves no trace in the job output: the
      # `up --wait` step reports only "container X exited (1)", and the reason
      # lives in a container log nobody ever printed. Four integration jobs
      # have been red since this workflow was written and none of them said
      # why. Dump the logs on failure so the next red run is diagnosable.
      - name: Container logs (on failure)
        if: failure()
        env:
          # The prod-test overlay declares OPENFGA_STORE_ID as required, and the
          # spec sets it only for the stack it starts — not for this step. A
          # placeholder keeps interpolation happy; nothing is started here, so
          # the value is never used. Without it the dump fails to parse and
          # reports the missing variable instead of the logs it exists to show.
          OPENFGA_STORE_ID: diagnostic-placeholder
          OIDC_DEFAULT_TENANT: diagnostic-placeholder
        run: |
          files=""
          for f in Orion/docker-compose.yaml Orion/docker-compose.test.yaml Orion/docker-compose.prod-test.yaml; do
            [ -f "$f" ] && files="$files -f $f"
          done
          docker compose $files ps -a || true
          docker compose $files logs --no-color --tail 200 || true
  enforcement-e2e:
    name: Enforcement E2E (prod security, capability gating, consent vocab)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The high-value enforcement specs are env-gated + DESTRUCTIVE: each tears the
    # stack down and boots it in a NON-default mode (NODE_ENV=production / a
    # distinct DOMAIN_PACKS set / a custom consent vocabulary) on the shared
    # ports. They cannot run inside the standard integration suite (which assumes
    # the default dev all-packs stack) nor concurrently with each other. This
    # dedicated job runs them one spec at a time so real OIDC/OpenFGA enforcement,
    # capability gating, and consent-vocab validation are exercised on every
    # push/PR — not only when a developer sets the opt-in env flag locally.
    env:
      POSTGRES_PASSWORD: postgres
      KEYCLOAK_ADMIN_PASSWORD: admin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Compose reads Orion/.env (project dir) for the two intentionally-required
      # vars; the specs spawn `docker compose` children that need the file on disk.
      - name: Create Orion/.env for compose
        run: |
          printf 'POSTGRES_PASSWORD=postgres\nKEYCLOAK_ADMIN_PASSWORD=admin\n' > Orion/.env
      # vitest runs the package directly (no turbo build step), so workspace deps
      # must be built first for vite to resolve them.
      - name: Build workspace
        run: pnpm run build
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build stack images
        # bake resolves deps-full/deps-app named contexts that plain
        # `docker compose build` cannot. --load tags orion-<service>:latest
        # into the local daemon so the specs' `docker compose up` finds them.
        run: docker buildx bake --load
      # Each spec self-manages the Docker lifecycle (down -v -> up -> assert ->
      # down -v). Run sequentially; the filename filter + env flag keep exactly
      # one destructive spec active at a time.
      - name: Prod-mode security-enforcement E2E
        run: SECURITY_E2E=1 pnpm --filter @altius/integration-tests exec vitest run security-enforcement
      - name: Capability-gating negative E2E
        run: CAPABILITY_E2E=1 pnpm --filter @altius/integration-tests exec vitest run capability-gating
      - name: Open-consent-vocabulary E2E
        run: CONSENT_VOCAB_E2E=1 pnpm --filter @altius/integration-tests exec vitest run open-consent-vocab
      # Six consecutive runs failed on `container orion-web-1 is unhealthy`
      # with no container output captured anywhere, so every attempt to fix it
      # was a guess from the outside. `up --wait` prints only which container it
      # gave up on; the reason lives in that container's log and in its last
      # healthcheck result, and the teardown below destroys both.
      - name: Diagnose stack on failure
        if: failure()
        run: |
          set +e
          COMPOSE="docker compose -f Orion/docker-compose.yaml -f Orion/docker-compose.test.yaml"
          echo "::group::container status"
          $COMPOSE ps -a
          echo "::endgroup::"
          echo "::group::healthcheck output"
          for c in $($COMPOSE ps -aq); do
            echo "--- $(docker inspect -f '{{.Name}}' $c)"
            docker inspect -f '{{json .State.Health}}' $c
          done
          echo "::endgroup::"
          echo "::group::container logs"
          $COMPOSE logs --no-color --tail=200
          echo "::endgroup::"
      - name: Tear down stack
        if: always()
        run: docker compose -f Orion/docker-compose.yaml down -v --remove-orphans
      # A stack that fails to come up leaves no trace in the job output: the
      # `up --wait` step reports only "container X exited (1)", and the reason
      # lives in a container log nobody ever printed. Four integration jobs
      # have been red since this workflow was written and none of them said
      # why. Dump the logs on failure so the next red run is diagnosable.
      - name: Container logs (on failure)
        if: failure()
        env:
          # The prod-test overlay declares OPENFGA_STORE_ID as required, and the
          # spec sets it only for the stack it starts — not for this step. A
          # placeholder keeps interpolation happy; nothing is started here, so
          # the value is never used. Without it the dump fails to parse and
          # reports the missing variable instead of the logs it exists to show.
          OPENFGA_STORE_ID: diagnostic-placeholder
          OIDC_DEFAULT_TENANT: diagnostic-placeholder
        run: |
          files=""
          for f in Orion/docker-compose.yaml Orion/docker-compose.test.yaml Orion/docker-compose.prod-test.yaml; do
            [ -f "$f" ] && files="$files -f $f"
          done
          docker compose $files ps -a || true
          docker compose $files logs --no-color --tail 200 || true
  helm-lint:
    name: Helm lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Lint chart
        run: >-
          helm lint --strict Orion/helm/altius
          --set auth.oidc.clientId=ci
          --set authz.openfga.storeId=ci
          --set auth.oidc.defaultTenant=ci-tenant

  image-scan:
    name: Trivy image scan (HIGH/CRITICAL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # bake does not interpolate the compose file, so the two required vars
    # (POSTGRES_PASSWORD, KEYCLOAK_ADMIN_PASSWORD) are not needed here —
    # only the built image layers are scanned, nothing runs.
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build all images
        # bake builds every target in the default group (all 7 services),
        # which is wider than the compose profiles below — a scan must cover
        # what is shipped, not what is convenient to run. --load tags
        # orion-<service>:latest into the local daemon for the Trivy loop.
        run: docker buildx bake --load
      - name: Install trivy
        run: |
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v0.71.0/trivy_0.71.0_Linux-64bit.tar.gz" \
            | sudo tar xz -C /usr/local/bin trivy
      - name: Scan all images (fail on HIGH/CRITICAL)
        run: |
          status=0
          for img in cel-evaluator api-gateway ontology-engine action-executor security-service sync-engine web; do
            echo "::group::trivy orion-$img"
            trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 "orion-$img:latest" || status=1
            echo "::endgroup::"
          done
          exit $status
