name: Build and Push Docker Images

# Builds all service images and pushes them to GitHub Container Registry.
# Runs on pushes to main (tags :latest and :sha-<short-sha>) and on version
# tags (tags :<version> and :latest). PRs build only (no push) to verify
# Dockerfiles without publishing.
#
# Uses `docker buildx bake` (not docker/build-push-action per service) so the
# shared deps-app/deps-full stages are resolved as local bake targets via
# named build contexts — the same mechanism the CI workflow uses. The matrix
# approach could not resolve `FROM deps-app`/`FROM deps-full` because
# build-push-action's docker-container driver cannot reference images loaded
# into the host daemon.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push all images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io requires lowercase image paths. github.repository preserves
      # case (e.g. "daemon-blockint-tech/Altius-System"), so lowercase it.
      - name: Compute registry path
        id: registry
        run: echo "path=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # bake resolves deps-app/deps-full as local build targets (see
      # docker-bake.hcl contexts mapping), builds all 7 services, and tags
      # them as <registry>/<service>:latest + :sha-<short>. --push for
      # pushes to main/tags, --load for PRs (verify Dockerfiles without
      # publishing).
      - name: Build and push all images
        env:
          REGISTRY: ${{ steps.registry.outputs.path }}
          IMAGE_PREFIX: ""
          SEP: "/"
          GIT_REVISION: sha-${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            docker buildx bake --load
          else
            docker buildx bake --push
          fi

      - name: Scan all images for HIGH/CRITICAL vulnerabilities
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ steps.registry.outputs.path }}/api-gateway:latest
          severity: HIGH,CRITICAL
          exit-code: '0'
