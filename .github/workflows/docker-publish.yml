name: Build and Push Docker Images

# Builds all service images and pushes them to GitHub Container Registry.
# Runs on pushes to main (tags :latest and :sha-<short-sha>) and on version
# tags (tags :<version> and :latest). PRs build only (no push) to verify
# Dockerfiles without publishing.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-and-push:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            dockerfile: packages/api/Dockerfile
            context: .
          - service: action-executor
            dockerfile: packages/actions/Dockerfile
            context: .
          - service: security-service
            dockerfile: packages/security/Dockerfile
            context: .
          - service: cel-evaluator
            dockerfile: packages/cel-evaluator/Dockerfile
            context: packages/cel-evaluator
          # Static bundle + nginx. Included here so the deployment path is
          # actually exercised: nothing else builds this image, and its nginx
          # config has never been machine-checked (`nginx -t` needs a registry
          # pull that does not work on the dev machine). A failure in this job
          # is the config, not a flake.
          - service: web
            dockerfile: packages/web/Dockerfile
            context: .
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # Build (and push, when not a PR) using registry-backed layer cache so
      # dependency layers are reused across CI runs, not just within one.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image for HIGH/CRITICAL vulnerabilities
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          severity: HIGH,CRITICAL
          exit-code: '0'
