# Serves the SPA and proxies the API from the SAME origin.
#
# Same-origin is the point: it is what lets the bundle use a relative /graphql
# and be promoted between environments unchanged, and it means the browser never
# makes a cross-origin request, so the gateway's CORS policy is not in the path
# at all. CORS_ALLOWED_ORIGINS then only matters for callers served elsewhere.

# $connection_upgrade is not built in. Without this map it expands to the empty
# string and nginx refuses to start on an unknown variable, so the WebSocket
# upgrade below has to define it. conf.d is included at http scope, which is
# the only place a map is allowed.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The bundle is content-hashed by vite, so it is safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or a deploy leaves browsers loading the
    # previous bundle's asset names and the app fails on stale hashes.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /graphql {
        proxy_pass http://api-gateway:4000/graphql;
        proxy_http_version 1.1;
        # Subscriptions are graphql-ws over the same path, so the upgrade
        # headers have to be forwarded or the socket silently downgrades.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A subscription is a long-lived stream; the 60s default would drop it.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://api-gateway:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routing: the OIDC redirect lands on a path this server has no
    # file for, so unknown paths must serve the app rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
