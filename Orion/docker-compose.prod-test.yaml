# Override that runs the api-gateway in NODE_ENV=production so real OIDC
# (Keycloak) + OpenFGA enforcement are exercised end-to-end (security E2E).
# OIDC_ISSUER matches the external token `iss` (KC_HOSTNAME_STRICT=false);
# OIDC_JWKS_URI is the in-cluster certs URL the gateway can actually reach.
services:
  api-gateway:
    environment:
      NODE_ENV: production
      OIDC_ISSUER: "http://localhost:8180/auth/realms/altius"
      OIDC_CLIENT_ID: altius
      OIDC_JWKS_URI: "http://keycloak:8080/auth/realms/altius/protocol/openid-connect/certs"
      OPENFGA_STORE_ID: "${OPENFGA_STORE_ID:?set OPENFGA_STORE_ID}"
      # One store must name the tenant it serves; without this the API
      # refuses to boot rather than serving every tenant from one namespace.
      # Must match the tenant the tokens actually claim. The shipped realm gives
      # dr-test and admin-test `tenant_id: default`, and the claim wins over
      # this default (oidc-authenticator.ts), so keying the OpenFGA store map
      # to anything else maps every request to NO store. Reads then fail
      # closed — which is why the deny-asserting specs still passed — while
      # writeRelationship throws UNKNOWN_TENANT and the grant answers 500.
      OIDC_DEFAULT_TENANT: "${OIDC_DEFAULT_TENANT:-default}"
      FHIR_BASE_URL: "http://localhost:4000/fhir"
