{{/*
HELM-14: Create a dedicated ServiceAccount for all Altius deployments.
Avoids using the cluster default service account which may have excessive permissions.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "altius.serviceAccountName" . }}
  labels:
    {{- include "altius.labels" . | nindent 4 }}
automountServiceAccountToken: false
