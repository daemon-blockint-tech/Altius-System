apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "altius.fullname" . }}-config
  labels:
    {{- include "altius.labels" . | nindent 4 }}
data:
  STORAGE_PROVIDER: {{ .Values.storage.provider | quote }}
  POSTGRES_HOST: {{ .Values.storage.postgres.host | quote }}
  POSTGRES_PORT: {{ .Values.storage.postgres.port | quote }}
  POSTGRES_DB: {{ .Values.storage.postgres.database | quote }}
  # {{if .Values.eventBus.redpanda.bootstrapServers }}
  REDPANDA_BROKERS: {{ .Values.eventBus.redpanda.bootstrapServers | quote }}
  # {{end}}
  # {{if .Values.redis.url }}
  REDIS_URL: {{ .Values.redis.url | quote }}
  # {{end}}
  OIDC_ISSUER: {{ .Values.auth.oidc.issuer | quote }}
  # HELM-05: OIDC_CLIENT_ID moved to deployment env from secret if sensitive,
  # kept in ConfigMap as it is typically a public client identifier
  OIDC_CLIENT_ID: {{ .Values.auth.oidc.clientId | quote }}
  # {{if .Values.auth.oidc.jwksUri }}
  OIDC_JWKS_URI: {{ .Values.auth.oidc.jwksUri | quote }}
  # {{end}}
  # {{if .Values.auth.oidc.defaultTenant }}
  OIDC_DEFAULT_TENANT: {{ .Values.auth.oidc.defaultTenant | quote }}
  # {{end}}
  OPENFGA_URL: {{ .Values.authz.openfga.url | quote }}
  # Authorization is per-tenant: each tenant's tuples live in its own OpenFGA
  # store. Fail at template time rather than letting the pod crash-loop — the
  # API refuses to start on a config that cannot isolate tenants, and a chart
  # error says which knob is missing.
  # {{ if and (not .Values.authz.openfga.storeIds) (not (and .Values.authz.openfga.storeId .Values.auth.oidc.defaultTenant)) }}
  # {{ fail "Set authz.openfga.storeIds (tenant -> storeId) for a multi-tenant install, or BOTH authz.openfga.storeId and auth.oidc.defaultTenant for a single-tenant one. A store id without a default tenant would serve every tenant from one tuple namespace." }}
  # {{ end }}
  # HELM-06: store ids are infrastructure config, not secrets
  OPENFGA_STORE_ID: {{ .Values.authz.openfga.storeId | quote }}
  # {{ if .Values.authz.openfga.storeIds }}
  OPENFGA_STORE_IDS: {{ $pairs := list }}{{ range $tenant, $store := .Values.authz.openfga.storeIds }}{{ $pairs = append $pairs (printf "%s=%s" $tenant $store) }}{{ end }}{{ join "," $pairs | quote }}
  # {{ end }}
  CEL_EVALUATOR_URL: {{ .Values.celEvaluator.url | quote }}
  # T6: Debezium Connect REST endpoint. Used to register connectors that
  # stream change events into Redpanda topics consumed by KafkaCdcSource.
  # Register via: curl -X POST http://debezium:8083/connectors ...
  DEBEZIUM_URL: {{ .Values.sync.debezium.url | quote }}
  # T6: Webhook ingest secret. Unset → ingest endpoint disabled.
  # For production, prefer setting this via an external secret and
  # envFrom.secretRef rather than a plaintext configmap value.
  # {{if .Values.ingest.secret }}
  INGEST_SECRET: {{ .Values.ingest.secret | quote }}
  # {{end}}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.observability.otlp.endpoint | quote }}
  DOMAIN_PACKS: {{ .Values.domainPacks | toJson | quote }}
  # {{if .Values.domainPacksExtra.sources }}
  # {{$paths := list }}
  # {{range .Values.domainPacksExtra.sources }}
  # {{$paths = append $paths .mountPath }}
  # {{end}}
  DOMAIN_PACKS_EXTRA_DIRS: {{ $paths | join ":" | quote }}
  # {{end}}
  NODE_ENV: {{ .Values.nodeEnv | default "production" | quote }}
  # {{if .Values.cors.allowedOrigins }}
  CORS_ALLOWED_ORIGINS: {{ .Values.cors.allowedOrigins | join "," | quote }}
  # {{end}}
  # {{if .Values.fhirBaseUrl }}
  FHIR_BASE_URL: {{ .Values.fhirBaseUrl | quote }}
  # {{end}}
  # {{if and .Values.governance .Values.governance.relationshipGranterRoles }}
  RELATIONSHIP_GRANTER_ROLES: {{ .Values.governance.relationshipGranterRoles | join "," | quote }}
  # {{end}}
  # {{if and .Values.governance .Values.governance.consentRecorderRoles }}
  CONSENT_RECORDER_ROLES: {{ .Values.governance.consentRecorderRoles | join "," | quote }}
  # {{end}}
  # {{if and .Values.governance .Values.governance.consentPurposes }}
  CONSENT_PURPOSES: {{ .Values.governance.consentPurposes | join "," | quote }}
  # {{end}}
  # {{if and .Values.governance .Values.governance.defaultConsentPurpose }}
  DEFAULT_CONSENT_PURPOSE: {{ .Values.governance.defaultConsentPurpose | quote }}
  # {{end}}
  # {{if and .Values.governance .Values.governance.consentSubjectTypes }}
  CONSENT_SUBJECT_TYPES: {{ .Values.governance.consentSubjectTypes | join "," | quote }}
  # {{end}}
  # {{if and .Values.governance .Values.governance.directCareExemption }}
  CONSENT_DIRECT_CARE_EXEMPTION: "true"
  # {{end}}
  # {{if and .Values.governance .Values.governance.exemptionPurpose }}
  CONSENT_EXEMPTION_PURPOSE: "{{ .Values.governance.exemptionPurpose }}"
  # {{end}}
